# The Windows build (docs/plans/all-platforms.md, slice 2): the core and the app with MSYS2's
# clang64 toolchain, from public sources only. Started by hand; it keeps the package's zip as a run artifact.
name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No line ending translation
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: clang64
          update: true
          path-type: inherit
          install: git
          pacboy: >-
            toolchain:p cmake:p ninja:p spirv-tools:p sdl3:p sdl3-image:p sdl3-ttf:p imagemagick:p librsvg:p
      - name: Sources
        run: |
          # The tools and the app's CMake both find the shared checkouts under the Windows home.
          export HOME=$(cygpath -m "$USERPROFILE")
          uv run --frozen z3dmods sources
      - name: Package
        run: |
          export HOME=$(cygpath -m "$USERPROFILE")
          uv run --frozen z3dmods package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: z3d-windows-x86_64
          path: build/package/z3d-windows-x86_64.zip
          if-no-files-found: error
