# Our play HUD (app/src/hud.hpp): each element's place on the top screen's 400x240 pixels and the
# guest memory it reads. `at` is a sum: a global of the decomp, `Struct.field` offsets, defines and
# numbers (decomp/mm3d docs/hud.md names them).

# What every button shares: an item's count is an entry of the game's ammo array ([item id,
# index], for the items seen drawing a count; the fire arrow draws the bow's), and an item on one
# of the game's own buttons is dim while that button's status says so.
ammo = { at = ["gCommonData", "CommonData.save", "SaveData.ammo"], bytes = 1 }
ammo_index = [[1, 1], [2, 1], [6, 6], [7, 7], [8, 8], [9, 9], [10, 10]]
status = { at = ["gCommonData", "CommonData.buttonStatus"], bytes = 1 }
disabled = 0xFF
# A song's note by its entry in the ocarina's song list: Time, Healing, Epona's, Soaring, Storms,
# the Sonata, the Goron Lullaby, its intro, the New Wave, the Elegy, the Oath, the Inverted Song
# of Time, the Song of Double Time and the scarecrow's.
song_colours = [
  0x8FD0F7, 0xF2A0C8, 0xD9925A, 0xF2F7FA, 0xB8C4D4, 0x35C24A, 0xE8403A,
  0xF09A8A, 0x3A7BE8, 0xF09A2A, 0x8A4AE0, 0x5AA0C8, 0xC8E8FF, 0xF2D82A,
]

[icons]
sheet = "layout/Joker.Main.gar/icon_item_menu00.ctxb"
frames = "sItemIconFrames"
count = "ITEM_ICON_COUNT"
none = "ITEM_ICON_NONE"
frame = [42, 42]
columns = 12
icons = 108

# The touch screen HUD's own art: a rupee per wallet, the key and a heart by quarters.
[art]
sheet = "layout/US_English/Joker.Main.Play.gar/hud_patrs00_action_text.ctxb"
rupee_green = [456, 60, 18, 18]
rupee_blue = [456, 41, 18, 18]
rupee_red = [456, 23, 18, 18]
key = [456, 96, 22, 22]
heart_0 = [482, 66, 12, 12]
heart_1 = [482, 50, 12, 12]
heart_2 = [482, 34, 12, 12]
heart_3 = [482, 18, 12, 12]
heart_4 = [482, 2, 12, 12]

[[element]]
kind = "hearts"
rect = [8, 8, 11, 11]
unit = 0x10
columns = 10
art = ["heart_0", "heart_1", "heart_2", "heart_3", "heart_4"]
value = { at = ["gCommonData", "CommonData.save", "SaveData.health"], bytes = 2 }
capacity = { at = ["gCommonData", "CommonData.save", "SaveData.healthCapacity"], bytes = 2 }

# 0x30 fills the meter; the doubled meter's 0x60 is inferred from its length.
[[element]]
kind = "meter"
rect = [8, 32, 63, 7]
full = 0x30
value = { at = ["gCommonData", "CommonData.save", "SaveData.magic"], bytes = 1 }
when = [{ at = ["gCommonData", "CommonData.save", "SaveData.magicAcquired"], bytes = 1, least = 1 }]
longer = { at = ["gCommonData", "CommonData.save", "SaveData.doubleMagicAcquired"], bytes = 1 }

# The A button's words: an action's number is its word's cell.
[words]
sheet = "layout/US_English/Joker.Main.Play.gar/hud_patrs00_action_text.ctxb"
first = [0, 93]
cell = [64, 18]
rows = 9
count = "DO_ACTION_WORDS"
none = "DO_ACTION_NONE"

# The wallet picks the gem; green at its capacity, gUpgradeCapacities[UPGRADE_WALLET] (four u16).
[[element]]
kind = "counter"
art = ["rupee_green", "rupee_blue", "rupee_red"]
rect = [8, 198, 40, 13]
value = { at = ["gCommonData", "CommonData.save", "SaveData.rupees"], bytes = 2 }
tier = { at = ["gCommonData", "CommonData.save", "SaveData.upgrades"], bytes = 4, mask = "UPGRADE_WALLET_MASK", shift = "UPGRADE_WALLET_SHIFT" }
limit = { at = ["gUpgradeCapacities", 32], bytes = 2 }

# Play, top right: the pad's diamond, RB at its corner and the D-pad's cross beside it. A is the
# action with its word (the game's own A button is hidden by the patch, base_hud.cpp) and X the
# sword; Y, B, RB and the D-pad are item slots (app/src/pad_input.hpp numbers them), and with
# the chord held the diamond shows the chord's four.

[[element]]
kind = "button"
frame = "ring"
verb = "action"
chord_slot = 7
rect = [346, 56, 24, 24]
label = { at = ["PlayState.aButtonDoAction"], through = "gPlayState", bytes = 2 }

[[element]]
kind = "button"
frame = "ring"
slot = 1
chord_slot = 8
rect = [373, 29, 24, 24]

[[element]]
kind = "button"
frame = "ring"
verb = "sword"
chord_slot = 9
rect = [319, 29, 24, 24]
value = { at = ["gCommonData", "CommonData.save", "SaveData.equipment", "EquipmentData.buttonItems", "EQUIP_BUTTON_B"], bytes = 1 }
status = { at = ["gCommonData", "CommonData.buttonStatus", "EQUIP_BUTTON_B"], bytes = 1 }

[[element]]
kind = "button"
frame = "ring"
slot = 0
chord_slot = 10
rect = [346, 2, 24, 24]

[[element]]
kind = "button"
frame = "ring"
slot = 2
rect = [377, 3, 20, 20]

