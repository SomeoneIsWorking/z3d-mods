# The draw section the app replays (docs/plans/replay-interpolation.md), from Play_Main's call of
# Play_Draw to Graph_DrawFrame's call of the frame end (decomp/mm3d docs/frame.md), each a function
# and a define of its offset.
open_site = ["Play_Main", "PLAY_MAIN_DRAW_CALL"]
close_site = ["Graph_DrawFrame", "GRAPH_DRAW_FRAME_END_CALL"]
# The section's output: the requests of the bound nn::gx command list, which the frame end runs.
bound_cmdlist = ["gNngxState", "NngxState.boundCmdlist"]
cmdlist_requests = ["GxCmdlist.requests"]
cmdlist_request_count = ["GxCmdlist.requestCount"]
# A play state started again (scene change, warp, respawn) restarts its frame count: a cut.
play_frames = ["PlayState.frames"]
# The camera track: View_LookAt's inputs in the play state's view, and the active camera's eye and
# at; the view's offset from them is the quake (decomp/mm3d docs/camera.md "The view").
view_eye = ["PlayState.view", "View.eye"]
view_at = ["PlayState.view", "View.at"]
view_up = ["PlayState.view", "View.up"]
view_fovy = ["PlayState.view", "View.fovy"]
cameras = ["PlayState.cameraPtrs"]
active_camera = ["PlayState.activeCamera"]
camera_eye = ["Camera.eye"]
camera_at = ["Camera.at"]
# The door cut: the active camera's function as Camera_Update picks it, and Camera_Special9's step
# that puts the eye beyond the door (decomp/mm3d docs/camera.md "The door camera").
camera_setting = ["Camera.setting"]
camera_mode = ["Camera.mode"]
camera_anim_state = ["Camera.animState"]
camera_settings = ["sCameraSettings"]
camera_setting_modes = ["CameraSetting.cameraModes"]
camera_mode_function = ["CameraMode.funcIdx"]
door_camera_function = ["CAM_FUNC_SPEC9"]
door_camera_far_side = ["CAM_SPEC9_ANIM_FAR_SIDE"]
# The cutscene group cut: command 90's interpolators' group type, which reads pending from the tick
# a group is reached to the tick its shot starts (decomp/mm3d docs/cutscene.md "The camera's shots").
cutscene_eye_group_type = ["sCutsceneCameraInfo", "CutsceneCamera.eyeInterp", "CutsceneCameraInterp.type"]
cutscene_at_group_type = ["sCutsceneCameraInfo", "CutsceneCamera.atInterp", "CutsceneCameraInterp.type"]
cutscene_group_pending = ["CS_CAM_GROUP_PENDING"]
# The actor track: the actor lists, and the position and rotation an actor's model is placed by.
actor_lists = ["PlayState.actorCtx", "ActorContext.actorLists"]
actor_list_count = ["ACTORCAT_COUNT"]
actor_list_head = ["ActorListEntry.head"]
actor_next = ["Actor.next"]
actor_id = ["Actor.id"]
actor_position = ["Actor.world", "PosRot.pos"]
actor_shape_rotation = ["Actor.shape", "ActorShape.rot"]
# The skeleton track: the skeletons SkelAnime_DrawOpa and SkelAnime_DrawOpaEx queue (r1 of their
# queue call, decomp/mm3d docs/actors.md "Skeletons"), and their joint tables.
skeleton_draw_calls = [
  ["SkelAnime_DrawOpa", "SKELANIME_DRAW_OPA_QUEUE_CALL"],
  ["SkelAnime_DrawOpaEx", "SKELANIME_DRAW_OPA_EX_QUEUE_CALL"],
]
skeleton_draw_arg = [1]
skeleton_model = ["SkelAnime.model"]
skeleton_limb_count = ["SkelAnime.limbCount"]
skeleton_joint_table = ["SkelAnime.jointTable"]
# The fade track: the scene transition's instance while its draw is TransitionFade_Draw, the fade
# flash, and the fill colour TransitionFade_Draw reads (decomp/mm3d docs/frame.md "Fades").
transition = ["PlayState.transitionCtx"]
transition_draw = ["PlayState.transitionCtx", "TransitionContext.draw"]
fade_flash = ["PlayState.transitionFadeFlash"]
fade_draw = ["TransitionFade_Draw"]
fade_type = ["TransitionFade.type"]
fade_color = ["TransitionFade.a"]
# The material track: the scene's material animations, which the update steps and applies
# (Scene_UpdateRoomAnims through AnimPlayerList_Update, decomp/mm3d docs/frame.md "Material
# animations"), made again as the replay's leads; and the models' own, which Model_Update steps in
# the draw through the player's vtable, those calls that reach AnimPlayer_Update. Their frame,
# speed and loop, and the frame count AnimPlayer_Step wraps at.
material_lead_calls = [["AnimPlayerList_Update", "ANIM_PLAYER_LIST_UPDATE_CALL"]]
material_step_calls = [["Model_Update", "MODEL_UPDATE_MATERIAL_CALL"]]
material_step_arg = [0]
material_update = ["AnimPlayer_Update"]
material_anim = ["AnimPlayer.anim"]
material_anim_file = ["CmabResource.file"]
material_frame = ["AnimPlayer.frame"]
material_speed = ["AnimPlayer.speed"]
material_loop = ["AnimPlayer.loop"]
material_paused = ["AnimPlayer.paused"]
cmab_anim_offset = ["CmabHeader.animOffset"]
cmab_frame_count = ["CmabAnim.frameCount"]
# The GSP interrupt lock: the interrupt thread holds it at the title screen's section starts, and a
# replay, which runs no other thread, starts with it free (decomp/mm3d docs/frame.md "The GSP
# interrupt lock").
held_lock = ["gGspInterruptLock"]
lock_event = ["OsCriticalSection.event"]
lock_owner = ["OsCriticalSection.ownerTls"]
lock_count = ["OsCriticalSection.count"]
