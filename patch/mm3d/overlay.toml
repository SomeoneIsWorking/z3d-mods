# The app's single screen (app/src/screen_overlay.hpp): which layout each touch screen takes, and
# the layouts. A layout places the top screen and pieces of the touch screen on the top screen's
# 400x240 pixels; a piece is `from` [x, y, width, height] in the touch screen's 320x240 pixels
# drawn at `to`, with corners rounded by `radius` touch pixels. Only a menu shows the touch screen,
# and whole: play's view never does.

# Outside play (the title, file select) and on a screen not named here. "split" is the app's own:
# the two screens side by side.
outside = "split"

[screens]
UI_SCREEN_BLACK = "top_only"
UI_SCREEN_MAIN = { layout = "play", hidden = "top_only" }
UI_SCREEN_OCARINA = "ocarina"
UI_SCREEN_GEAR = "menu"
UI_SCREEN_ITEMS = "menu"
UI_SCREEN_MASKS = "menu"

[layouts.top_only]
pieces = []

# The game's menus keep a title bar along the top of the top screen.
[layouts.menu]
pieces = [{ from = [0, 0, 320, 240], to = [59.2, 28.8, 281.6, 211.2] }]

[layouts.ocarina]
pieces = [{ from = [0, 0, 320, 240], to = [4, 4, 128, 96], radius = 8, opacity = 0.85 }]

# Play: the top screen alone, under our own HUD (hud.toml).
[layouts.play]
hud = true
pieces = []
