# Our play HUD (app/src/hud.hpp): each element's place on the top screen's 400x240 pixels and the
# guest memory it reads (decomp/oot3d docs/hud.md names it). `at` is a sum: a global of the
# decomp, `Struct.field` offsets, defines and numbers; `through` reads it off a guest pointer.
# The base mod's own HUD is switched off in hooks.s (base_hud). The buttons sit top right: the
# game's minimap keeps the bottom right.

# Play: a loaded file, the game's HUD fully shown, no menu up.
show = [
  { at = ["gSaveContext", "SaveContext.gameMode"], bytes = 4, equals = 0 },
  { at = ["gSaveContext", "SaveContext.hudVisibilityMode"], bytes = 2, equals = 50 },
  { at = ["gHud", "Hud.state"], bytes = 4, equals = 2 },
]

# What every button shares: an item's count is an entry of the game's ammo array ([item id,
# index]), and an item on one of the game's own buttons is dim while that button's status says so.
ammo = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.ammo"], bytes = 1 }
ammo_index = [[0, 0], [1, 1], [2, 2], [3, 3], [4, 3], [6, 6], [9, 8], [12, 3], [16, 14], [18, 3]]
status = { at = ["gSaveContext", "SaveContext.buttonStatus"], bytes = 1 }
disabled = 0xFF
# A song's note by its place among the quest items' songs: the warp songs in their own colours
# (Minuet to Prelude), then Zelda's Lullaby, Epona's, Saria's, the Sun's, Time and Storms.
song_colours = [
  0x35C24A, 0xE8403A, 0x3A7BE8, 0xF09A2A, 0x8A4AE0, 0xF2D82A,
  0xF2A0C8, 0xD9925A, 0x9BE07A, 0xFFF0A0, 0x8FD0F7, 0xB8C4D4,
]

# An item's frame in the sheet is its id.
[icons]
sheet = "menu/01_US_ENGLISH/icon_item_menu00.ctxb"
frame = [42, 42]
columns = 12
icons = 144

# The touch screen HUD's own art: the rupee, the key and a heart by quarters.
[art]
sheet = "menu/01_US_ENGLISH/menu_top_parts00.ctxb"
rupee = [128, 96, 18, 18]
key = [152, 96, 18, 18]
heart_0 = [240, 80, 12, 12]
heart_1 = [240, 96, 12, 12]
heart_2 = [240, 112, 12, 12]
heart_3 = [240, 128, 12, 12]
heart_4 = [240, 144, 12, 12]

# The A button's words: an action's number is its word's cell.
[words]
sheet = "menu/01_US_ENGLISH/hud_all00.ctxb"
first = [0, 93]
cell = [64, 18]
rows = 9
count = "DO_ACTION_WORDS"
none = "DO_ACTION_NONE"

[[element]]
kind = "hearts"
rect = [8, 8, 11, 11]
unit = 0x10
columns = 10
art = ["heart_0", "heart_1", "heart_2", "heart_3", "heart_4"]
value = { at = ["gSaveContext", "SaveContext.health"], bytes = 2 }
capacity = { at = ["gSaveContext", "SaveContext.healthCapacity"], bytes = 2 }

[[element]]
kind = "meter"
rect = [8, 32, 63, 7]
value = { at = ["gSaveContext", "SaveContext.magic"], bytes = 1 }
capacity = { at = ["gSaveContext", "SaveContext.magicMeterSize"], bytes = 2 }
longer = { at = ["gSaveContext", "SaveContext.doubleMagic"], bytes = 1 }

[[element]]
kind = "counter"
icon = "rupee"
rect = [8, 198, 40, 13]
value = { at = ["gSaveContext", "SaveContext.rupees"], bytes = 2 }
# Green at the wallet's capacity: gUpgradeCapacities[UPG_WALLET], four u16, by the wallet's bits
# (gUpgradeMasks and gUpgradeShifts [UPG_WALLET]).
tier = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.upgrades"], bytes = 4, mask = 0x3000, shift = 12 }
limit = { at = ["gUpgradeCapacities", 32], bytes = 2 }

# Small keys: the dungeons' scenes, where the dungeon has a count.
[[element]]
kind = "counter"
icon = "key"
rect = [8, 180, 40, 13]
value = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.dungeonKeys"], bytes = 1 }
index = { at = ["gSaveContext", "SaveContext.mapIndex"], bytes = 2 }
when = [
  { at = ["PlayState.sceneNum"], through = "gPlayState", bytes = 2, least = 3, most = 16 },
  { at = ["gSaveContext", "SaveContext.mapIndex"], bytes = 2, most = 18 },
]

# Play, top right: the pad's diamond, RB at its corner and the D-pad's cross beside it. A is the
# action with its word (the cell of its DO_ACTION_*, [words]) and X the sword; Y, B, RB and the
# D-pad are item slots (app/src/pad_input.hpp numbers them), and with the chord held the diamond
# shows the chord's four.

[[element]]
kind = "button"
frame = "ring"
verb = "action"
chord_slot = 7
rect = [346, 56, 24, 24]
label = { at = ["gTopHud", "TopHud.doAction"], bytes = 4 }

[[element]]
kind = "button"
frame = "ring"
slot = 1
chord_slot = 8
rect = [373, 29, 24, 24]

[[element]]
kind = "button"
frame = "ring"
verb = "sword"
chord_slot = 9
rect = [319, 29, 24, 24]
value = { at = ["gSaveContext", "SaveContext.equips", "ItemEquips.buttonItems", 0], bytes = 1 }
status = { at = ["gSaveContext", "SaveContext.buttonStatus", 0], bytes = 1 }

