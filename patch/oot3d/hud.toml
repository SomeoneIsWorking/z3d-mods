# Our play HUD (app/src/hud.hpp): each element's place on the top screen's 400x240 pixels and the
# guest memory it reads (decomp/oot3d docs/hud.md names it). `at` is a sum: a global of the
# decomp, `Struct.field` offsets, defines and numbers; `through` reads it off a guest pointer,
# `of = "player"` off the player actor.
# The base mod's own HUD is switched off in hooks.s (base_hud). The buttons sit top right: the
# game's minimap keeps the bottom right.

# Play: a loaded file, the game's HUD fully shown (on foot or mounted), no menu up.
show = [
  { at = ["gSaveContext", "SaveContext.gameMode"], bytes = 4, equals = 0 },
  { at = ["gSaveContext", "SaveContext.hudVisibilityMode"], bytes = 2, equals = ["HUD_VISIBILITY_ALL", "HUD_VISIBILITY_A_B_MINIMAP"] },
  { at = ["gHud", "Hud.state"], bytes = 4, equals = 2 },
]

# What every button shares: an item's count is an entry of the game's ammo array ([item id,
# index]), and an item on one of the game's own buttons is dim while that button's status says so.
ammo = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.ammo"], bytes = 1 }
ammo_index = [[0, 0], [1, 1], [2, 2], [3, 3], [4, 3], [6, 6], [9, 8], [12, 3], [16, 14], [18, 3]]
# A count is green at the game's capacity for it, CUR_CAPACITY of its upgrade at the save's level;
# the arrows show the quiver's count. The bombchus at 50 and the beans at 15
# (HudItemButtons_UpdateAmmo).
upgrades = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.upgrades"], bytes = 4 }
upgrade_masks = { at = ["gUpgradeMasks"], bytes = 4 }
upgrade_shifts = { at = ["gUpgradeShifts"], bytes = 1 }
upgrade_capacities = { at = ["gUpgradeCapacities"], bytes = 2 }
upgrade_levels = "UPGRADE_LEVELS"
ammo_full = [
  { item = "ITEM_STICK", upgrade = "UPG_STICKS" },
  { item = "ITEM_NUT", upgrade = "UPG_NUTS" },
  { item = "ITEM_BOMB", upgrade = "UPG_BOMB_BAG" },
  { item = "ITEM_BOW", upgrade = "UPG_QUIVER" },
  { item = "ITEM_ARROW_FIRE", upgrade = "UPG_QUIVER" },
  { item = "ITEM_ARROW_ICE", upgrade = "UPG_QUIVER" },
  { item = "ITEM_ARROW_LIGHT", upgrade = "UPG_QUIVER" },
  { item = "ITEM_SLINGSHOT", upgrade = "UPG_BULLET_BAG" },
  { item = "ITEM_BOMBCHU", most = 50 },
  { item = "ITEM_BEAN", most = 15 },
]
status = { at = ["gSaveContext", "SaveContext.buttonStatus"], bytes = 1 }
disabled = 0xFF
# The game's item buttons (Y, X, I, II) in that array: a slot on none of them is dim while the
# game has all four disabled (mounted, indoors).
status_lanes = [1, 2, 3, 4]
# The game's own B button in a minigame (TopHud.bButtonMode; decomp docs/hud.md) holds the item
# the game lends and the shots left; the button that reads the game's B item shows them instead.
lent = [
  { item = "ITEM_SLINGSHOT", over = 1, count = { at = ["PlayState.shootingGalleryStatus"], through = "gPlayState", bytes = 1 }, when = [
    { at = ["gTopHud", "TopHud.bButtonMode"], bytes = 4, equals = "B_BUTTON_SHOOTING_GALLERY" },
    { at = ["gSaveContext", "SaveContext.linkAge"], bytes = 4, equals = 1 },
  ] },
  { item = "ITEM_BOW", over = 1, count = { at = ["PlayState.shootingGalleryStatus"], through = "gPlayState", bytes = 1 }, when = [
    { at = ["gTopHud", "TopHud.bButtonMode"], bytes = 4, equals = "B_BUTTON_SHOOTING_GALLERY" },
  ] },
  { item = "ITEM_BOMBCHU", count = { at = ["PlayState.bombchuBowlingStatus"], through = "gPlayState", bytes = 1 }, when = [
    { at = ["gTopHud", "TopHud.bButtonMode"], bytes = 4, equals = "B_BUTTON_BOWLING" },
  ] },
  { item = "ITEM_FISHING_POLE", when = [
    { at = ["gTopHud", "TopHud.bButtonMode"], bytes = 4, equals = "B_BUTTON_FISHING" },
  ] },
  { item = "ITEM_BOW", count = { at = ["PlayState.interfaceCtx", "InterfaceContext.hbaAmmo"], through = "gPlayState", bytes = 2 }, when = [
    { at = ["gTopHud", "TopHud.bButtonMode"], bytes = 4, equals = "B_BUTTON_HORSEBACK_ARCHERY" },
  ] },
]
# A song's note by its place among the quest items' songs: the warp songs in their own colours
# (Minuet to Prelude), then Zelda's Lullaby, Epona's, Saria's, the Sun's, Time and Storms.
song_colours = [
  0x35C24A, 0xE8403A, 0x3A7BE8, 0xF09A2A, 0x8A4AE0, 0xF2D82A,
  0xF2A0C8, 0xD9925A, 0x9BE07A, 0xFFF0A0, 0x8FD0F7, 0xB8C4D4,
]

# An item's frame in the sheet is its id.
[icons]
sheet = "menu/01_US_ENGLISH/icon_item_menu00.ctxb"
frame = [42, 42]
columns = 12
icons = 144

# The touch screen HUD's own art: the rupee, the key, a heart by quarters and Epona's carrot,
# whole and spent.
[art]
sheet = "menu/01_US_ENGLISH/menu_top_parts00.ctxb"
rupee = [128, 96, 18, 18]
key = [152, 96, 18, 18]
heart_0 = [240, 80, 12, 12]
heart_1 = [240, 96, 12, 12]
heart_2 = [240, 112, 12, 12]
heart_3 = [240, 128, 12, 12]
heart_4 = [240, 144, 12, 12]
carrot = [488, 0, 24, 24]
carrot_spent = [488, 24, 24, 24]
view = [128, 0, 48, 48]
navi = [176, 0, 48, 48]
view_camera = [128, 48, 48, 48]
view_back = [176, 48, 48, 48]

# The A button's words: an action's number is its word's cell; a sheet a system language, the
# first the one shown in a language not listed.
[words]
sheet = "menu/{language}/hud_all00.ctxb"
languages = { en = "01_US_ENGLISH", fr = "05_US_FRENCH", es = "07_US_SPANISH" }
first = [0, 93]
cell = [64, 18]
rows = 9
count = "DO_ACTION_WORDS"
none = "DO_ACTION_NONE"

[[element]]
kind = "hearts"
rect = [8, 8, 11, 11]
unit = 0x10
columns = 10
art = ["heart_0", "heart_1", "heart_2", "heart_3", "heart_4"]
value = { at = ["gSaveContext", "SaveContext.health"], bytes = 2 }
capacity = { at = ["gSaveContext", "SaveContext.healthCapacity"], bytes = 2 }

# Epona's carrots beside the hearts while Link rides (the game puts them in the hearts' place):
# a row of the kind the hearts are, whole for each boost left.
[[element]]
kind = "hearts"
rect = [122, 7, 12, 12]
columns = 6
full = "HORSE_BOOSTS"
art = ["carrot_spent", "carrot"]
value = { at = ["PlayState.interfaceCtx", "InterfaceContext.numHorseBoosts"], through = "gPlayState", bytes = 1 }
when = [{ at = ["gHud", "Hud.statusLayout"], bytes = 4, equals = "HUD_STATUS_MOUNTED" }]

[[element]]
kind = "meter"
rect = [8, 32, 63, 7]
value = { at = ["gSaveContext", "SaveContext.magic"], bytes = 1 }
capacity = { at = ["gSaveContext", "SaveContext.magicMeterSize"], bytes = 2 }
longer = { at = ["gSaveContext", "SaveContext.doubleMagic"], bytes = 1 }

[[element]]
kind = "counter"
icon = "rupee"
rect = [8, 198, 40, 13]
value = { at = ["gSaveContext", "SaveContext.rupees"], bytes = 2 }
# Green at the wallet's capacity: gUpgradeCapacities[UPG_WALLET], four u16, by the wallet's bits
# (gUpgradeMasks and gUpgradeShifts [UPG_WALLET]).
tier = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.upgrades"], bytes = 4, mask = 0x3000, shift = 12 }
limit = { at = ["gUpgradeCapacities", 32], bytes = 2 }

# Small keys: the dungeons' scenes, where the dungeon has a count; none (-1) until the first.
[[element]]
kind = "counter"
icon = "key"
rect = [8, 183, 40, 13]
none = 0xFF
value = { at = ["gSaveContext", "SaveContext.inventory", "Inventory.dungeonKeys"], bytes = 1 }
index = { at = ["gSaveContext", "SaveContext.mapIndex"], bytes = 2 }
when = [
  { at = ["PlayState.sceneNum"], through = "gPlayState", bytes = 2, least = 3, most = 16 },
  { at = ["gSaveContext", "SaveContext.mapIndex"], bytes = 2, most = 18 },
]

# View, the touch screen's own icon for the look (Hud_UpdateGameplay picks its cell): Navi while
# she calls, BACK in first person, the camera where the scene has two fixed ones, else the eye;
# dim while the game takes no press of it.
[[element]]
kind = "prompt"
device = "pad"
verb = "first_person"
rect = [290, 3, 24, 24]
dim = { at = ["gHud", "Hud.flags"], bytes = 4, mask = "HUD_FLAG_VIEW_DIM" }
looks = [
  { art = "navi", when = [{ at = ["PlayState.interfaceCtx", "InterfaceContext.naviCalling"], through = "gPlayState", bytes = 2, least = 1 }] },
  { art = "view_back", when = [{ at = ["Player.viewMode"], of = "player", bytes = 1, equals = "PLAYER_VIEW_FIRST_PERSON" }] },
  { art = "view_camera", when = [{ at = ["R_SCENE_CAM_TYPE_OFFSET"], through = "gGameInfo", bytes = 2, equals = "SCENE_CAM_TYPE_FIXED_TOGGLE_VIEWPOINT" }] },
  { art = "view" },
]

[[element]]
kind = "prompt"
device = "keyboard"
verb = "first_person"
rect = [292, 37, 24, 24]
dim = { at = ["gHud", "Hud.flags"], bytes = 4, mask = "HUD_FLAG_VIEW_DIM" }
looks = [
  { art = "navi", when = [{ at = ["PlayState.interfaceCtx", "InterfaceContext.naviCalling"], through = "gPlayState", bytes = 2, least = 1 }] },
  { art = "view_back", when = [{ at = ["Player.viewMode"], of = "player", bytes = 1, equals = "PLAYER_VIEW_FIRST_PERSON" }] },
  { art = "view_camera", when = [{ at = ["R_SCENE_CAM_TYPE_OFFSET"], through = "gGameInfo", bytes = 2, equals = "SCENE_CAM_TYPE_FIXED_TOGGLE_VIEWPOINT" }] },
  { art = "view" },
]

