# The draw section the app replays (docs/plans/replay-interpolation.md), from Gameplay_Update's
# branch to Gameplay_Draw to Graph_DrawFrame's call of the frame end (decomp/oot3d docs/frame.md),
# each a function and a define of its offset.
open_site = ["Gameplay_Update", "GAMEPLAY_UPDATE_DRAW_CALL"]
close_site = ["Graph_DrawFrame", "GRAPH_DRAW_FRAME_END_CALL"]
# The section's output: the requests of the bound nn::gx command list, which the frame end runs.
bound_cmdlist = ["gNngxState", "NngxState.boundCmdlist"]
cmdlist_requests = ["GxCmdlist.requests"]
cmdlist_request_count = ["GxCmdlist.requestCount"]
# A play state started again (scene change, warp, respawn) restarts its frame count: a cut.
play_frames = ["PlayState.state", "GameState.frames"]
# The camera track: View_LookAt's inputs in the play state's view, and the active camera's eye and
# at, which carry no quake offset.
view_eye = ["PlayState.view", "View.eye"]
view_at = ["PlayState.view", "View.lookAt"]
view_up = ["PlayState.view", "View.up"]
view_fovy = ["PlayState.view", "View.fovy"]
cameras = ["PlayState.cameraPtrs"]
active_camera = ["PlayState.activeCamera"]
camera_eye = ["Camera.eye"]
camera_at = ["Camera.at"]
# The actor track: the actor lists, and what Actor_Draw builds an actor's model matrix from.
actor_lists = ["PlayState.actorCtx", "ActorContext.actorLists"]
actor_list_count = ["ACTORCAT_MAX"]
actor_list_head = ["ActorListEntry.head"]
actor_next = ["Actor.next"]
actor_id = ["Actor.id"]
actor_position = ["Actor.world", "PosRot.pos"]
actor_shape_rotation = ["Actor.shape", "ActorShape.rot"]
# The skeleton track: the skeletons SkelAnime_DrawOpa queues (its r1), and their joint tables.
skeleton_draw_call = ["SkelAnime_DrawOpa", "SKELANIME_DRAW_OPA_QUEUE_CALL"]
skeleton_draw_arg = [1]
skeleton_model = ["SkelAnime.model"]
skeleton_limb_count = ["SkelAnime.limbCount"]
skeleton_joint_table = ["SkelAnime.jointTable"]
# The fade track: the scene transition's instance while its draw is TransitionFade_Draw, the fade
# flash, and the fill colour TransitionFade_Draw reads.
transition = ["PlayState.transitionCtx"]
transition_draw = ["PlayState.transitionCtx", "TransitionContext.draw"]
fade_flash = ["PlayState.transitionFadeFlash"]
fade_draw = ["TransitionFade_Draw"]
fade_type = ["TransitionFade.type"]
fade_color = ["TransitionFade.a"]
# The material track: the material animations Scene_Draw steps (AnimPlayer_Update's r0; the time
# of day's list is left out, its frame is set from the time), their frame, speed and loop, and the
# frame count AnimPlayer_Update wraps at.
material_step_calls = [
  ["Scene_Draw", "SCENE_DRAW_ANIM_UPDATE_CALL"],
  ["Scene_Draw", "SCENE_DRAW_ANIM_UPDATE_CALL_A0"],
  ["Scene_Draw", "SCENE_DRAW_ANIM_UPDATE_CALL_A1"],
  ["Scene_Draw", "SCENE_DRAW_ANIM_UPDATE_CALL_B0"],
  ["Scene_Draw", "SCENE_DRAW_ANIM_UPDATE_CALL_B1"],
]
material_step_arg = [0]
material_anim = ["AnimPlayer.anim"]
material_frame = ["AnimPlayer.frame"]
material_speed = ["AnimPlayer.speed"]
material_loop = ["AnimPlayer.loop"]
material_paused = ["AnimPlayer.paused"]
cmab_anim_offset = ["CmabHeader.animOffset"]
cmab_frame_count = ["CmabAnim.frameCount"]
