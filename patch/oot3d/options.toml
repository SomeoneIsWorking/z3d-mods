# The patch's switches, one byte each in this order (tools/z3dmods/options.py). The app's options
# menu lists them by label; a feature reads its own through options() from the generated options.hpp.

[[option]]
id = "cutscene_skip"
field = "cutsceneSkip"
label = "Cutscene skip (Start)"
default = true

[[option]]
id = "quick_text"
field = "quickText"
label = "Quick Text"
default = true

[[option]]
id = "free_camera"
field = "freeCamera"
label = "Free camera (right stick)"
default = true

[[option]]
id = "free_camera_invert_x"
field = "freeCameraInvertX"
label = "Free camera: invert X"
default = false

[[option]]
id = "free_camera_invert_y"
field = "freeCameraInvertY"
label = "Free camera: invert Y"
default = false

[[option]]
id = "autosave"
field = "autosave"
label = "Autosave after each scene change"
default = false

# Times the mouse's 0.05 degrees a count, for the camera and the aim.
[[option]]
id = "mouse_sensitivity"
pad = "mouse_scale"
label = "Mouse sensitivity"
scales = [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]
default = 1.0

# Each size's rise in N64 units: Medium is about the painted steps' own.
[[option]]
id = "stair_size"
label = "Stepped stairs"
default = "Medium"
layers = [
  { label = "Small", folder = "romfs_stairs_small", rise = 5.0 },
  { label = "Medium", folder = "romfs_stairs_medium", rise = 8.0 },
  { label = "Large", folder = "romfs_stairs_large", rise = 14.0 },
]
