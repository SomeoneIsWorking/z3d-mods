[project]
name = "z3d-mods"
version = "0.1.0"
description = "Mod setup and our own mods for OoT3D and MM3D on Azahar"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

# What only the checkout's tools use; a package carries the dependencies above alone.
[dependency-groups]
dev = [
    "evdev>=2.0.0",
]

[project.scripts]
z3dmods = "z3dmods.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/z3dmods"]
